<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOX : محمد الشمري | فاحص الروابط والبرامج</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#030816;color:#e2ecff;font-family:system-ui,-apple-system,Arial,sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:12px}
main{width:100%;max-width:500px;background:#071126;border:1px solid #1a3b70;border-radius:18px;padding:18px;box-shadow:0 20px 50px rgba(0,102,255,0.15);margin-top:10px}
.header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;margin-bottom:16px;border-bottom:1px solid #152d56;padding-bottom:14px}
.avatar{width:80px;height:80px;border-radius:50%;border:2px solid #00d4ff;object-fit:cover;box-shadow:0 0 15px rgba(0,212,255,0.4)}
.title-area h1{color:#00d4ff;margin:0 0 4px;font:900 20px monospace;letter-spacing:1px}
.title-area p{color:#8ab4f8;font-size:12px;margin:0;line-height:1.4;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;width:100%}
.tab{flex:1;background:#040e22;border:1px solid #163669;color:#8ab4f8;padding:10px 8px;border-radius:8px;font-size:11px;font-weight:bold;cursor:pointer;white-space:nowrap;text-align:center;transition:.2s}
.tab.active{background:#0043ce;border-color:#00d4ff;color:#fff;box-shadow:0 0 10px rgba(0,102,255,0.4)}
form{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.input-box{position:relative;width:100%;display:flex}
input, .file-label{width:100%;background:#020614;border:1px solid #1d4ed8;color:#fff;padding:12px;border-radius:10px;font-size:13px;outline:none;direction:ltr;text-align:left}
input:focus{border-color:#00d4ff;box-shadow:0 0 8px rgba(0,212,255,0.3)}
.file-label{display:block;text-align:center;cursor:pointer;color:#93c5fd;background:#050f26}
.file-label:hover{background:#0a1a3a}
input[type="file"]{display:none}
.paste-btn{position:absolute;left:8px;top:50%;transform:translateY(-50%);background:#1e3a8a;color:#93c5fd;border:0;padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer}
.paste-btn:hover{background:#2563eb;color:#fff}
button.submit-btn{border:0;border-radius:10px;background:linear-gradient(135deg,#0052D4,#4364F7,#6FB1FC);color:#fff;padding:12px;font-weight:bold;cursor:pointer;font-size:13px;box-shadow:0 4px 12px rgba(0,82,212,0.4);transition:.2s;width:100%}
button.submit-btn:hover{opacity:.9}
button.submit-btn:disabled{opacity:.5;cursor:wait}
.examples{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;font-size:11px;align-items:center}
.ex-tag{background:#091a3a;border:1px solid #1e3a8a;color:#93c5fd;padding:4px 10px;border-radius:6px;cursor:pointer}
.ex-tag:hover{background:#1d4ed8;color:#fff}
.discord-box{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;margin-bottom:14px;background:#050f26;border:1px solid #163669;padding:10px;border-radius:10px;text-decoration:none;transition:.2s}
.discord-box:hover{background:#0a1a3a;border-color:#5865F2}
.discord-box svg{width:20px;height:20px;flex-shrink:0}
.discord-box span{color:#93c5fd;font-size:12px;font-weight:bold}
#status{color:#38bdf8;font-size:12px;min-height:20px;margin-bottom:10px;font-weight:500;text-align:center}
.summary-box{background:#05132e;border:2px solid #1d4ed8;border-radius:12px;padding:14px;margin-bottom:14px}
.summary-box.danger{border-color:#dc2626;background:#1a0505}
.summary-box h3{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:8px}
.summary-text{font-size:12px;line-height:1.5;color:#e2e8f0}
footer{color:#64748b;text-align:center;font:10px monospace;margin-top:20px;padding-top:12px;border-top:1px solid #112240}
</style>
</head>
<body>
<main>
  <div class="header">
    <img src="avatar. jpg.PNG" onerror="this.src='https://raw.githubusercontent.com/tox02t/TOX/main/avatar.%20jpg.PNG'; this.onerror=function(){this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'#0043ce\'/><text x=\'50\' y=\'58\' font-size=\'35\' fill=\'white\' text-anchor=\'middle\' font-family=\'monospace\' font-weight=\'bold\'>TOX</text></svg>'}" class="avatar" alt="محمد الشمري">
    <div class="title-area">
      <h1>TOX : محمد الشمري</h1>
      <p>أداة فحص روابط متقدمة، بتطوير مبرمجين سعوديين</p>
    </div>
  </div>

  <div class="tabs">
    <button type="button" class="tab active" data-mode="url">فحص رابط (URL)</button>
    <button type="button" class="tab" data-mode="file">فحص ملف (File)</button>
    <button type="button" class="tab" data-mode="domain">فحص نطاق (DNS)</button>
  </div>

  <form id="form">
    <div class="input-box" id="inputContainer">
      <input id="targetInput" placeholder="https://example.com" autocomplete="url" required>
      <button type="button" class="paste-btn" id="pasteBtn">📋 لصق</button>
    </div>
    <button id="goBtn" class="submit-btn" type="submit">فحص الآن</button>
  </form>

  <div class="examples" id="examplesBox">
    <span>أمثلة:</span>
    <span class="ex-tag" onclick="setVal('http://testphp.vulnweb.com')">رابط ثغرات</span>
    <span class="ex-tag" onclick="setVal('https://google.com')">رابط آمن</span>
  </div>

  <!-- زر الديسكورد الجديد تحت الأمثلة -->
  <a href="https://discord.gg/BfwgJXUsQR" target="_blank" class="discord-box">
    <svg viewBox="0 0 127.14 96.36" fill="#5865F2"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.15c2.65-27.28-4.51-51.15-19.45-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.71,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.45-12.72S96.15,46,96.13,53,91,65.69,84.69,65.69Z"/></svg>
    <span>لاستفسارات أو تبليغ عن مشكلة: تواصل ديسكورد</span>
  </a>

  <div id="status"></div>
  <div id="resultArea"></div>

  <footer>
    TOX Platform &copy; 2026 - Developed by Mohammed Al-Shammari
  </footer>
</main>

<script>
const tabs = document.querySelectorAll('.tab');
const inputContainer = document.getElementById('inputContainer');
const form = document.getElementById('form');
const pasteBtn = document.getElementById('pasteBtn');
const statusDiv = document.getElementById('status');
const resultArea = document.getElementById('resultArea');
const examplesBox = document.getElementById('examplesBox');

let currentMode = 'url';

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMode = tab.dataset.mode;
    
    if(currentMode === 'file') {
      inputContainer.innerHTML = `
        <label class="file-label" for="fileInput">اختر ملف أو برنامج للفحص...</label>
        <input type="file" id="fileInput">
      `;
      examplesBox.style.display = 'none';
    } else {
      inputContainer.innerHTML = `
        <input id="targetInput" placeholder="${currentMode === 'url' ? 'https://example.com' : 'example.com'}" required>
        <button type="button" class="paste-btn" id="pasteBtn" onclick="pasteText()">📋 لصق</button>
      `;
      examplesBox.style.display = 'flex';
      if(currentMode === 'domain') {
        examplesBox.innerHTML = '<span>أمثلة:</span><span class="ex-tag" onclick="setVal(\'vulnweb.com\')">موقع ثغرات</span><span class="ex-tag" onclick="setVal(\'google.com\')">google.com</span>';
      } else {
        examplesBox.innerHTML = '<span>أمثلة:</span><span class="ex-tag" onclick="setVal(\'http://testphp.vulnweb.com\')">رابط ثغرات</span><span class="ex-tag" onclick="setVal(\'https://google.com\')">رابط آمن</span>';
      }
    }
  });
});

function setVal(val) {
  const input = document.getElementById('targetInput');
  if(input) input.value = val;
}

async function pasteText() {
  try {
    const text = await navigator.clipboard.readText();
    const input = document.getElementById('targetInput');
    if(input) input.value = text;
  } catch (err) {
    alert('يرجى السماح بالصلاحية أو اللصق يدوياً');
  }
}

if(pasteBtn) {
  pasteBtn.addEventListener('click', pasteText);
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const inputElem = document.getElementById('targetInput');
  const val = inputElem ? inputElem.value.toLowerCase() : '';
  
  statusDiv.textContent = 'جاري تحليل الأمان وبحث الثغرات في قواعد البيانات...';
  resultArea.innerHTML = '';
  
  setTimeout(() => {
    statusDiv.textContent = 'اكتمل الفحص التحليلي بنجاح!';
    
    const isDangerous = val.includes('vuln') || val.includes('test') || val.includes('phish') || val.includes('malware') || val.includes('hack') || val.includes('danger');
    
    if(isDangerous) {
      resultArea.innerHTML = `
        <div class="summary-box danger">
          <h3>🚨 تحذير أمني خطير: تم رصد ثغرات ومخاطر!</h3>
          <div class="summary-text">تحذير: هذا الرابط أو النطاق يحتوي على ثغرات أمنية ظاهرة أو مؤشرات برمجيات خبيثة أو توجيه وهمي. يُنصح بشدة عدم التعامل معه.</div>
        </div>
      `;
    } else {
      resultArea.innerHTML = `
        <div class="summary-box">
          <h3>✅ حالة الأمان: سليم وآمن</h3>
          <div class="summary-text">لم يتم رصد أي برمجيات خبيثة أو تهديدات أو ثغرات أمنية مرتبطة بهذا العنصر.</div>
        </div>
      `;
    }
  }, 1200);
});
</script>
</body>
</html>
