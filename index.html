<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOX : محمد الشمري | فاحص الروابط والبرامج</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#030816;color:#e2ecff;font-family:system-ui,-apple-system,Arial,sans-serif;display:grid;place-items:center;padding:16px}
main{width:min(850px,100%);background:#071126;border:1px solid #1a3b70;border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(0,102,255,0.15)}
.header{display:flex;align-items:center;gap:16px;margin-bottom:20px;border-bottom:1px solid #152d56;padding-bottom:16px}
.avatar{width:65px;height:65px;border-radius:50%;border:2px solid #00d4ff;object-fit:cover;box-shadow:0 0 15px rgba(0,212,255,0.4)}
.title-area h1{color:#00d4ff;margin:0 0 4px;font:900 22px monospace;letter-spacing:1px}
.title-area p{color:#8ab4f8;font-size:12px;margin:0}
.desc{background:#040e22;border:1px solid #163669;border-radius:12px;padding:12px 16px;color:#a8c7fa;font-size:13px;line-height:1.6;margin-bottom:18px}
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.tab{background:#040e22;border:1px solid #163669;color:#8ab4f8;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:bold;cursor:pointer;white-space:nowrap;transition:.2s}
.tab.active{background:#0043ce;border-color:#00d4ff;color:#fff;box-shadow:0 0 12px rgba(0,102,255,0.4)}
form{display:flex;gap:8px;margin-bottom:12px}
.input-box{position:relative;flex:1;display:flex}
input, .file-label{width:100%;background:#020614;border:1px solid #1d4ed8;color:#fff;padding:14px;border-radius:12px;font-size:14px;outline:none;direction:ltr;text-align:left}
input:focus{border-color:#00d4ff;box-shadow:0 0 8px rgba(0,212,255,0.3)}
.file-label{display:block;text-align:center;cursor:pointer;color:#93c5fd;background:#050f26}
.file-label:hover{background:#0a1a3a}
input[type="file"]{display:none}
.paste-btn{position:absolute;left:8px;top:50%;transform:translateY(-50%);background:#1e3a8a;color:#93c5fd;border:0;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer}
.paste-btn:hover{background:#2563eb;color:#fff}
button.submit-btn{border:0;border-radius:12px;background:linear-gradient(135deg,#0052D4,#4364F7,#6FB1FC);color:#fff;padding:0 24px;font-weight:bold;cursor:pointer;font-size:14px;box-shadow:0 4px 15px rgba(0,82,212,0.4);transition:.2s}
button.submit-btn:hover{opacity:.9}
button.submit-btn:disabled{opacity:.5;cursor:wait}
.examples{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;font-size:11px}
.ex-tag{background:#091a3a;border:1px solid #1e3a8a;color:#93c5fd;padding:4px 10px;border-radius:6px;cursor:pointer}
.ex-tag:hover{background:#1d4ed8;color:#fff}
#status{color:#38bdf8;font-size:13px;min-height:22px;margin-bottom:12px;font-weight:500}
.summary-box{background:#05132e;border:2px solid #1d4ed8;border-radius:14px;padding:16px;margin-bottom:16px}
.summary-box h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.summary-text{font-size:14px;line-height:1.6;color:#e2e8f0}
.section-title{color:#38bdf8;font-size:12px;font-family:monospace;letter-spacing:1px;margin:20px 0 10px;border-right:3px solid #00d4ff;padding-right:8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{background:#040e22;border:1px solid #163669;border-radius:12px;padding:14px;min-width:0}
.item.full{grid-column:1 / -1}
.item small{display:block;color:#8ab4f8;margin-bottom:6px;font-size:12px}
.item strong{display:block;direction:ltr;text-align:left;overflow-wrap:anywhere;font-size:13px;color:#fff;font-weight:600;line-height:1.5}
.item strong.rtl{direction:rtl;text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:bold;margin-top:6px}
.badge.safe{background:rgba(16,185,129,0.2);color:#34d399;border:1px solid #059669}
.badge.warn{background:rgba(245,158,11,0.2);color:#fbbf24;border:1px solid #d97706}
.badge.danger{background:rgba(239,68,68,0.2);color:#f87171;border:1px solid #dc2626}
.vt-btn{display:inline-block;margin-top:8px;background:#1e3a8a;color:#93c5fd;text-decoration:none;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:bold}
.vt-btn:hover{background:#2563eb;color:#fff}
footer{color:#64748b;text-align:center;font:11px monospace;margin-top:24px;padding-top:16px;border-top:1px solid #112240}
@media(max-width:560px){.grid{grid-template-columns:1fr}form{flex-direction:column}button.submit-btn{padding:14px}}
</style>
</head>
<body>
<main>
  <div class="header">
    <img src="https://raw.githubusercontent.com/username/repo/main/avatar.jpg" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'#0043ce\'/><text x=\'50\' y=\'58\' font-size=\'35\' fill=\'white\' text-anchor=\'middle\' font-family=\'monospace\' font-weight=\'bold\'>TOX</text></svg>'" class="avatar" alt="TOX">
    <div class="title-area">
      <h1>TOX : محمد الشمري</h1>
      <p>منصة الفحص الذكي للروابط، التطبيقات، والملفات والنطاقات</p>
    </div>
  </div>

  <div class="desc">
    أداة متطورة وسلسة تفحص الروابط والبرامج والملفات مباشرة، لكشف الروابط الوهمية، البرمجيات الضارة، وتحليل سجلات النطاقات لتفحص وأنت على بصيرة تامة.
  </div>

  <div class="tabs">
    <button type="button" class="tab active" data-mode="url">فحص رابط (URL)</button>
    <button type="button" class="tab" data-mode="file">فحص برنامج / ملف (File Hash)</button>
    <button type="button" class="tab" data-mode="domain">فحص نطاق (DNS)</button>
  </div>

  <form id="form">
    <div class="input-box" id="inputContainer">
      <input id="targetInput" placeholder="https://example.com" autocomplete="url" required>
      <button type="button" class="paste-btn" id="pasteBtn">📋 لصق</button>
    </div>
    <button id="goBtn" class="submit-btn" type="submit">فحص الآن</button>
  </form>

  <div class="examples" id="examplesBox">
    <span>أمثلة سريعة:</span>
    <span class="ex-tag" data-val="https://google.com">Google</span>
    <span class="ex-tag" data-val="bit.ly/example">رابط مختصر</span>
